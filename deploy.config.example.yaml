# MSight Cloud — deployment configuration
# Copy this file to deploy.config.yaml and fill in your values.
# deploy.config.yaml is gitignored; never commit real account IDs.

# ── AWS target ────────────────────────────────────────────────────────────────
account: "123456789012"   # 12-digit AWS account ID
region: us-east-2

# ── Network ───────────────────────────────────────────────────────────────────
# Pin all single-AZ resources (ElastiCache, ECS tasks) to a specific AZ.
# Leave empty ("") to let CDK pick automatically.
preferredAz: ""

# ── Feature flags ─────────────────────────────────────────────────────────────
# debugMode: true deploys an extra cache-debug Lambda endpoint.
debugMode: false

# ── SPaT broadcast ────────────────────────────────────────────────────────────
# Radius (metres) used when fanning out SPaT messages to nearby WebSocket clients.
spatBroadcastRadiusM: 500

# ── Resource tags ─────────────────────────────────────────────────────────────
# Applied to every taggable resource in the stack.
#
# Tagging is what lets Cost Explorer separate this stack's spend from everything
# else in a shared AWS account. The tag key named by costAllocationTagKey must be
# activated as a cost allocation tag in the payer account before cost queries can
# filter on it — "Project" already is, in the account this deploys to.
#
# Cost attribution is NOT retroactive: spend is attributed only from the moment
# resources carry the tag, so the first tagged deploy starts the history.
#
# Omit this block entirely and the stack falls back to Project: msight-cloud.
tags:
  Project: msight-cloud
  Environment: production

# Which of the tags above identifies this stack when querying Cost Explorer.
# Must be one of the keys defined under `tags`; synth fails otherwise.
costAllocationTagKey: Project

# ── Admin console ─────────────────────────────────────────────────────────────
# The management console has no self-registration. This master account is seeded
# into the Cognito user pool on every deploy and is the only way in initially;
# it can then create additional users from the Users tab.
#
# SECURITY: masterPassword is passed to a CloudFormation custom resource, so it
# is visible in the synthesized template and in the CloudFormation console to
# anyone with stack read access. deploy.config.yaml itself is gitignored. Change
# this password from the console after the first sign-in, or move it to Secrets
# Manager if stack-read access is broader than console-admin access should be.
# masterPassword must satisfy the user pool policy, which is checked at synth
# time so a bad value fails immediately instead of rolling back a deployment:
#   - at least 12 characters
#   - an uppercase letter, a lowercase letter, a digit, and a symbol
adminConsole:
  masterUsername: admin
  masterEmail: you@example.com
  masterPassword: "ChangeMe!2026"
  # Extra origins allowed to call the admin API. The hosted console's own
  # CloudFront URL is added automatically, so this is only for local dev
  # servers and any other front end you point at this API.
  allowedOrigins:
    - http://localhost:5173

# ── Live clients ──────────────────────────────────────────────────────────────
# App IDs whose connected-client fleets the console may inspect. Listed here
# rather than discovered, so the console never has to scan the Valkey keyspace
# to find out which apps exist.
clientAppIds:
  - app_demo

# ── Config cache ──────────────────────────────────────────────────────────────
# Seconds the SPaT consumers cache their configuration lookups (which apps want
# SPaT, and where each intersection is).
#
# Those two queries sit on a path that runs at roughly 10 Hz per sensor. Run
# uncached they held Aurora at 116 connections with capacity against its
# ceiling, and Aurora Serverless bills per ACU-hour — so this is a cost setting.
#
# The trade is staleness: adding an app or moving an intersection takes up to
# this long to take effect. Raise it to save more, lower it for faster edits.
configCacheTtlSeconds: 60

# ── Log retention ─────────────────────────────────────────────────────────────
# How long CloudWatch keeps log events, in days.
#
# Retention is the only thing that bounds log storage. Left unset, CloudWatch
# keeps events forever and bills for them — two Lambda log groups in this stack
# reached 276 GB between them that way.
#
# Note this caps STORAGE, not ingestion. Ingestion is billed per GB written and
# is far the larger cost on this stack; it is controlled by how much the code
# logs, not by this setting. The hot-path functions log per-message detail only
# when DEBUG_LOGGING is set on them.
#
# Must be a value CloudWatch accepts: 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180,
# 365, 400, 545, 731, 1827, 3653 — or 0 to keep forever. Synth fails on anything
# else rather than letting the deploy fail with a less specific error.
#
# Omit the block, or any key in it, to take the defaults shown.
logRetentionDays:
  # Every Lambda in the stack. Long enough to investigate an incident.
  lambda: 7
  # Fargate sensor consumer containers.
  container: 7
  # API Gateway access logs — high volume, low value after a few days.
  api: 7

# ── Deployment identity ───────────────────────────────────────────────────────
# Names every resource this stack creates and identifies it in tags.
#
# Two things depend on it:
#   - SQS, SNS, ECS cluster and IAM role names are unique per AWS account. A
#     fixed name means a second MSight deployment cannot be created at all.
#   - Sensor queues and services are created at runtime, so teardown finds them
#     by tag. That tag must name the deployment, or destroying one stack would
#     reap another's queues.
#
# 3-24 characters, lowercase letters, digits and hyphens, starting with a letter.
# Changing it on an existing stack REPLACES the named resources — run
# `cdk diff` first.
deploymentName: msight-cloud

# ── Resource names ────────────────────────────────────────────────────────────
# Pins the names of resources whose rename would REPLACE them.
#
# Renaming an SNS topic changes its ARN, and every field sensor publishing to
# the old ARN goes silent with no error raised. Renaming the ECS cluster, the
# task role or a queue rebuilds them and discards in-flight messages. So an
# existing deployment pins the names it already has.
#
# Omit this whole block on a NEW deployment: every name then defaults to
# `<deploymentName>-...`, which is what lets two MSight stacks coexist in one
# AWS account. Only pin names when you are adopting resources that already
# exist.
#
# API Gateway and the Cognito user pool are absent on purpose — those rename in
# place, so their URLs and user accounts survive a change.
resourceNames:
  sensorTopic: msight-sensor-topic.fifo
  spatTopic: msight-spat-topic
  controlTopic: msight-control-topic
  cluster: msight-cluster
  sensorConsumerTaskRole: msight-sensor-consumer-task-role
  # Per-sensor queues and services are named <prefix>-<sensor>.
  sensorResourcePrefix: msight-sensor
  # CloudWatch log groups are named /<prefix>/...
  logPrefix: msight
